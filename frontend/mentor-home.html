<!DOCTYPE html>

<html>

<head>

<title>Mentor Dashboard</title>

<!-- GOOGLE FONT -->

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet"
>

<!-- CSS -->

<link rel="stylesheet" href="style/style.css">

</head>

<body>

<!-- =====================================================
NAVBAR
===================================================== -->

<div class="nav">

<img
src="image/logo_.png"
alt="logo"
class="logo"
>

<div class="header-right">

<img
src="image/default-profile.png"
id="profileBtn"
class="profile-icon"
alt="profile"
>

</div>

</div>


<!-- =====================================================
PROFILE SIDEBAR
===================================================== -->

<div
class="profile-sidebar"
id="profileSidebar"
>

<!-- =====================================================
SIDEBAR TOP
===================================================== -->

<div class="sidebar-top">

<img
src="image/default-profile.png"
id="profileImage"
class="profile-image"
onclick="openProfileUpload()"
>

<h2 id="profileName">
Mentor Name
</h2>

<p
class="role"
id="profileRole"
>
Mentor
</p>

<input
type="file"
id="profileUpload"
hidden
accept="image/*"
>

</div>


<!-- =====================================================
COURSE SECTION
===================================================== -->

<div class="course-section">

<button
class="add-course-btn"
onclick="openCreateCoursePanel()"
>

+ Add Course

</button>


<p
class="empty-message"
id="emptyMessage"
>

No courses created

</p>


<div
class="course-list"
id="courseList"
>

</div>

</div>


<!-- =====================================================
BOTTOM BUTTONS
===================================================== -->

<div class="sidebar-bottom">

<button
class="profile-btn"
onclick="goToProfile()"
>
Go To Profile
</button>

<button
class="logout-btn"
onclick="logoutUser()"
>
Logout
</button>

</div>

</div>


<!-- =====================================================
ADD COURSE MODAL
===================================================== -->

<div
class="course-modal-overlay"
id="courseModalOverlay"
>

<div
class="course-modal"
id="createCoursePanel"
>

<!-- =====================================================
MODAL HEADER
===================================================== -->

<div class="course-modal-header">

<h2 id="panelTitle">
Add Course
</h2>

<span
class="close-course-panel"
onclick="closeCreateCoursePanel()"
>
✕
</span>

</div>


<!-- =====================================================
SUBJECT SELECTION STEP
===================================================== -->

<div id="subjectSelectionStep">

<!-- SEARCH -->

<input
type="text"
id="subjectSearch"
class="course-search"
placeholder="Search Subject"
oninput="filterSubjects()"
>


<!-- TITLE -->

<h4 class="suggested-title">
Suggested Subjects
</h4>


<!-- SUBJECT CHIPS -->

<div
class="subject-chip-container"
id="subjectResults"
>

</div>


<!-- CREATE SUBJECT -->

<button
class="mentor-secondary-btn create-subject-btn"
onclick="openCustomCourseForm()"
>

+ Create New Subject

</button>

</div>


<!-- =====================================================
COURSE FORM STEP
===================================================== -->

<div
id="courseFormStep"
style="display:none;"
>

<!-- SUBJECT -->

<div class="course-form-group">

<label>
Subject
</label>

<input
type="text"
id="selectedSubject"
class="course-search"
readonly
>

</div>


<!-- COURSE TITLE -->

<div class="course-form-group">

<label>
Course Title
</label>

<input
type="text"
id="courseTitle"
class="course-search"
placeholder="Example: Java for Beginners"
>

</div>


<!-- DESCRIPTION -->

<div class="course-form-group">

<label>
Description
</label>

<textarea
id="courseDescription"
class="mentor-course-description"
placeholder="Write course description..."
></textarea>

</div>


<!-- BUTTONS -->

<div class="mentor-course-form-buttons">

<button
class="mentor-back-btn"
onclick="backToSubjectSelection()"
>
Back
</button>

<button class="mentor-save-btn">
Save Course
</button>

</div>

</div>

</div>

</div>


<!-- =====================================================
HOME CONTENT
===================================================== -->

<div class="home-content">

<h1 id="welcomeText">
Welcome Mentor 👋
</h1>

<p class="mentor-dashboard-subtitle">

Select a course to manage content

</p>


<!-- =====================================================
TOP TABS
===================================================== -->

<div class="mentor-tabs">

<div
class="mentor-tab active-tab"
onclick="switchMentorTab('videos', this)"
>
Video Lessons
</div>

<div
class="mentor-tab"
onclick="switchMentorTab('materials', this)"
>
Materials
</div>

<div
class="mentor-tab"
onclick="switchMentorTab('discussions', this)"
>
Discussions
</div>

<div
class="mentor-tab"
onclick="switchMentorTab('live', this)"
>
Live Classes
</div>

</div>


<!-- =====================================================
WORKSPACE
===================================================== -->

<div
class="mentor-workspace"
id="mentorWorkspace"
>

<h2>
Video Lessons
</h2>

<p>
Upload and manage your course videos here.
</p>

</div>

</div>


<!-- =====================================================
SCRIPT
===================================================== -->

<script src="script/script.js"></script>

</body>

</html>
